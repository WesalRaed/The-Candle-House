<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Candle House | My Orders</title>

    <link rel="stylesheet" href="style.css">


    <style>

        body {
            margin: 0;
            background: #faf8f5;
        }


        .orders-page {

            max-width: 1100px;

            margin: auto;

            padding: 70px 20px;

        }


        .orders-title {

            text-align: center;

            margin-bottom: 45px;

        }


        .orders-title p {

            color: #9a7950;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 2px;

            margin-bottom: 8px;

        }


        .orders-title h1 {

            font-size: 38px;

            margin: 0 0 12px;

            color: #292929;

        }


        .orders-title span {

            color: #777;

        }


        .order-card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.06);

        }


        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding-bottom: 18px;

            border-bottom: 1px solid #eee;

        }


        .order-id {

            font-weight: 700;

            color: #292929;

        }


        .order-date {

            color: #999;

            font-size: 14px;

            margin-top: 5px;

        }


        .order-status {

            background: #edf8f0;

            color: #398452;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 600;

        }


        .order-products {

            margin-top: 20px;

        }


        .order-product {

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 12px 0;

            border-bottom: 1px solid #f0f0f0;

        }


        .order-product:last-child {

            border-bottom: none;

        }


        .order-product img {

            width: 65px;

            height: 65px;

            object-fit: cover;

            border-radius: 12px;

        }


        .product-info {

            flex: 1;

        }


        .product-info h3 {

            margin: 0 0 5px;

            font-size: 16px;

            color: #333;

        }


        .product-info p {

            margin: 0;

            color: #999;

            font-size: 14px;

        }


        .product-price {

            font-weight: 600;

            color: #333;

        }


        .order-footer {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 20px;

            padding-top: 20px;

            border-top: 1px solid #eee;

        }


        .order-payment {

            color: #777;

            font-size: 14px;

        }


        .order-total {

            font-size: 20px;

            font-weight: 700;

            color: #292929;

        }


        .empty-orders {

            text-align: center;

            background: white;

            border-radius: 18px;

            padding: 60px 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.05);

        }


        .empty-orders-icon {

            font-size: 50px;

            margin-bottom: 15px;

        }


        .empty-orders h2 {

            margin-bottom: 10px;

            color: #333;

        }


        .empty-orders p {

            color: #888;

            margin-bottom: 25px;

        }


        .shop-button {

            display: inline-block;

            text-decoration: none;

            background: #292929;

            color: white;

            padding: 13px 25px;

            border-radius: 10px;

            font-weight: 600;

        }


        .shop-button:hover {

            background: #444;

        }


        @media (max-width: 600px) {

            .orders-title h1 {

                font-size: 30px;

            }


            .order-header {

                align-items: flex-start;

                flex-direction: column;

            }


            .order-footer {

                align-items: flex-start;

                flex-direction: column;

                gap: 10px;

            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        The Candle House
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Shop
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="index.html#about">
            About
        </a>

    </nav>

</header>



<!-- ================= ORDERS ================= -->

<section class="orders-page">


    <div class="orders-title">

        <p>
            YOUR SHOPPING HISTORY
        </p>

        <h1>
            My Orders
        </h1>

        <span>
            View your previous candle orders.
        </span>

    </div>



    <div id="ordersContainer"></div>


</section>



<!-- ================= FOOTER ================= -->

<footer>

    <div class="logo">
        The Candle House
    </div>

    <p>
        Handmade candles for beautiful moments.
    </p>

    <p>
        © 2026 The Candle House. All Rights Reserved.
    </p>

</footer>



<script>

function loadOrders() {


    const orders =
        JSON.parse(
            localStorage.getItem(
                "candleHouseOrders"
            )
        ) || [];


    const container =
        document.getElementById(
            "ordersContainer"
        );


    /* ==========================
       NO ORDERS
       ========================== */

    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-orders-icon">
                    🕯️
                </div>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    You haven't placed any
                    orders yet.
                </p>

                <a
                    href="products.html"
                    class="shop-button"
                >
                    Start Shopping
                </a>

            </div>

        `;

        return;

    }


    /* ==========================
       SHOW NEWEST FIRST
       ========================== */

    const sortedOrders =
        [...orders].reverse();


    container.innerHTML = "";


    sortedOrders.forEach(order => {


        const orderDate =
            new Date(order.date);


        const formattedDate =
            orderDate.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );


        let subtotal = 0;


        let productsHTML = "";


        order.items.forEach(item => {


            const itemTotal =
                item.price *
                item.quantity;


            subtotal += itemTotal;


            productsHTML += `

                <div class="order-product">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="product-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            Quantity:
                            ${item.quantity}
                            ×
                            $${item.price}
                        </p>

                    </div>

                    <div class="product-price">

                        $${itemTotal.toFixed(2)}

                    </div>

                </div>

            `;

        });


        let shipping = 0;


        if (
            subtotal > 0 &&
            subtotal < 200
        ) {

            shipping = 15;

        }


        const total =
            subtotal + shipping;


        let paymentText =
            "Cash on Delivery";


        if (
            order.paymentMethod === "card"
        ) {

            paymentText =
                "Credit / Debit Card";

        }


        if (
            order.paymentMethod === "bank"
        ) {

            paymentText =
                "Bank Transfer";

        }


        const orderCard =
            document.createElement("div");


        orderCard.className =
            "order-card";


        orderCard.innerHTML = `

            <div class="order-header">

                <div>

                    <div class="order-id">

                        Order #${order.orderNumber}

                    </div>

                    <div class="order-date">

                        ${formattedDate}

                    </div>

                </div>


                <div class="order-status">

                    Confirmed

                </div>

            </div>



            <div class="order-products">

                ${productsHTML}

            </div>



            <div class="order-footer">

                <div class="order-payment">

                    Payment:
                    ${paymentText}

                </div>


                <div class="order-total">

                    Total:
                    $${total.toFixed(2)}

                </div>

            </div>

        `;


        container.appendChild(
            orderCard
        );

    });

}



/* ==========================
   LOAD
   ========================== */

document.addEventListener(
    "DOMContentLoaded",
    loadOrders
);

</script>


</body>

</html>
